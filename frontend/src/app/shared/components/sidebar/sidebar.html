<!-- ====================================================================
     Sidebar admin — fixe sur desktop, top bar + bottom nav sur mobile
     ==================================================================== -->

<!-- Top bar mobile -->
<header class="lg:hidden fixed top-0 inset-x-0 z-40 h-[var(--header-h)] bg-ink-950/95 backdrop-blur-xl border-b border-white/[.06] flex items-center">
  <div class="w-full px-4 flex items-center justify-between">
    <a routerLink="/admin/dashboard" class="flex items-center gap-2.5 select-none">
      <img src="logocar.png" alt="" class="h-8 w-auto object-contain mix-blend-screen" />
      <span class="text-white font-extrabold tracking-tight">
        Auto<span class="text-brand-400">Reserve</span>
        <span class="ml-2 text-[10px] font-extrabold uppercase tracking-[.16em] text-ink-400 bg-white/[.07] rounded-full px-2 py-1">Admin</span>
      </span>
    </a>
    <button (click)="logout()" aria-label="Déconnexion"
            class="w-10 h-10 flex items-center justify-center rounded-full text-ink-300 hover:text-white hover:bg-white/10 transition-colors">
      <span class="material-symbols-outlined text-[22px]">logout</span>
    </button>
  </div>
</header>

<!-- Sidebar desktop -->
<aside class="hidden lg:flex fixed inset-y-0 left-0 z-40 w-64 flex-col bg-ink-950 border-r border-white/[.06]">

  <!-- Marque -->
  <a routerLink="/admin/dashboard" class="flex items-center gap-2.5 px-6 h-[var(--header-h)] border-b border-white/[.06] select-none">
    <img src="logocar.png" alt="" class="h-8 w-auto object-contain mix-blend-screen" />
    <span class="text-white font-extrabold tracking-tight">Auto<span class="text-brand-400">Reserve</span></span>
  </a>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto scrollbar-thin px-3 py-6 space-y-1">
    <p class="px-3 pb-2 text-[10px] font-extrabold uppercase tracking-[.18em] text-ink-500">Pilotage</p>

    <a routerLink="/admin/dashboard" routerLinkActive="bg-brand-600 text-white shadow-glow"
       class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-bold text-ink-400 hover:text-white hover:bg-white/[.06] transition-colors">
      <span class="material-symbols-outlined text-[21px]">space_dashboard</span>
      Tableau de bord
    </a>

    <a routerLink="/admin/reports" routerLinkActive="bg-brand-600 text-white shadow-glow"
       class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-bold text-ink-400 hover:text-white hover:bg-white/[.06] transition-colors">
      <span class="material-symbols-outlined text-[21px]">monitoring</span>
      Rapports
    </a>

    <p class="px-3 pt-6 pb-2 text-[10px] font-extrabold uppercase tracking-[.18em] text-ink-500">Gestion</p>

    <a routerLink="/admin/vehicles" routerLinkActive="bg-brand-600 text-white shadow-glow"
       class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-bold text-ink-400 hover:text-white hover:bg-white/[.06] transition-colors">
      <span class="material-symbols-outlined text-[21px]">directions_car</span>
      Véhicules
    </a>

    <a routerLink="/admin/bookings" routerLinkActive="bg-brand-600 text-white shadow-glow"
       class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-bold text-ink-400 hover:text-white hover:bg-white/[.06] transition-colors">
      <span class="material-symbols-outlined text-[21px]">event_available</span>
      Réservations
    </a>

    <a routerLink="/admin/customers" routerLinkActive="bg-brand-600 text-white shadow-glow"
       class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-bold text-ink-400 hover:text-white hover:bg-white/[.06] transition-colors">
      <span class="material-symbols-outlined text-[21px]">group</span>
      Clients
    </a>
  </nav>

  <!-- Pied -->
  <div class="p-4 border-t border-white/[.06]">
    <a routerLink="/" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-bold text-ink-400 hover:text-white hover:bg-white/[.06] transition-colors">
      <span class="material-symbols-outlined text-[20px]">storefront</span>
      Voir le site
    </a>
    <button (click)="logout()"
            class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-bold text-red-400 hover:bg-red-500/10 transition-colors">
      <span class="material-symbols-outlined text-[20px]">logout</span>
      Déconnexion
    </button>
  </div>
</aside>

<!-- Bottom nav mobile -->
<nav class="bottomnav grid-cols-5" aria-label="Navigation admin">
  <a routerLink="/admin/dashboard" routerLinkActive="is-active" class="bottomnav-item">
    <span class="material-symbols-outlined">space_dashboard</span>
    Tableau
  </a>
  <a routerLink="/admin/vehicles" routerLinkActive="is-active" class="bottomnav-item">
    <span class="material-symbols-outlined">directions_car</span>
    Véhicules
  </a>
  <a routerLink="/admin/bookings" routerLinkActive="is-active" class="bottomnav-item">
    <span class="material-symbols-outlined">event_available</span>
    Résas
  </a>
  <a routerLink="/admin/customers" routerLinkActive="is-active" class="bottomnav-item">
    <span class="material-symbols-outlined">group</span>
    Clients
  </a>
  <a routerLink="/admin/reports" routerLinkActive="is-active" class="bottomnav-item">
    <span class="material-symbols-outlined">monitoring</span>
    Rapports
  </a>
</nav>
