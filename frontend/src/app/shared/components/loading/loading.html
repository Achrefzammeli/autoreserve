<div class="flex flex-col items-center justify-center min-h-[300px] w-full p-8">
  
  <!-- Conteneur du Spinner -->
  <div class="relative flex items-center justify-center">
    
    <!-- Cercle extérieur rotatif -->
    <div class="w-20 h-20 border-4 border-blue-50 rounded-full animate-spin border-t-blue-600"></div>
    
    <!-- Cercle intérieur pulsant -->
    <div class="absolute w-10 h-10 bg-blue-600/10 rounded-full animate-ping"></div>
    
    <!-- Icône centrale fixe -->
    <div class="absolute">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
    </div>
  </div>

  <!-- Texte de chargement -->
  <div class="mt-8 text-center">
    <h3 class="text-xl font-bold text-gray-900 tracking-tight">Préparation de votre voyage</h3>
    <div class="flex items-center justify-center gap-1 mt-2">
        <p class="text-gray-500 font-medium">Recherche des meilleurs véhicules</p>
        <span class="flex gap-1">
            <span class="w-1 h-1 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.3s]"></span>
            <span class="w-1 h-1 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.15s]"></span>
            <span class="w-1 h-1 bg-blue-600 rounded-full animate-bounce"></span>
        </span>
    </div>
  </div>

</div>
