<!-- ====================================================================
     Barre de navigation principale — verre dépoli sur fond sombre
     ==================================================================== -->
<header class="fixed top-0 inset-x-0 z-50 h-[var(--header-h)] bg-ink-950/90 backdrop-blur-xl border-b border-white/[.06]">
  <nav class="container-app h-full flex items-center justify-between gap-4">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 shrink-0 select-none" aria-label="AutoReserve — accueil">
      <img [src]="logoSrc" (error)="handleLogoError()" alt=""
           class="h-9 w-auto object-contain mix-blend-screen" />
      <span class="text-white font-extrabold text-lg tracking-tight hidden sm:block">
        Auto<span class="text-brand-400">Reserve</span>
      </span>
    </a>

    <!-- Liens desktop -->
    <div class="hidden lg:flex items-center gap-1">
      <a routerLink="/" routerLinkActive="text-white bg-white/10"
         [routerLinkActiveOptions]="{exact: true}"
         class="px-4 py-2 rounded-full text-sm font-semibold text-ink-300 hover:text-white transition-colors">
        Accueil
      </a>
      <a routerLink="/fleet" routerLinkActive="text-white bg-white/10"
         class="px-4 py-2 rounded-full text-sm font-semibold text-ink-300 hover:text-white transition-colors">
        Notre flotte
      </a>
      <a routerLink="/about" routerLinkActive="text-white bg-white/10"
         class="px-4 py-2 rounded-full text-sm font-semibold text-ink-300 hover:text-white transition-colors">
        À propos
      </a>
      <a routerLink="/contact" routerLinkActive="text-white bg-white/10"
         class="px-4 py-2 rounded-full text-sm font-semibold text-ink-300 hover:text-white transition-colors">
        Contact
      </a>
    </div>

    <!-- Actions desktop -->
    <div class="hidden lg:flex items-center gap-2.5">
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/auth/login"
           class="px-4 py-2 rounded-full text-sm font-semibold text-ink-200 hover:text-white hover:bg-white/10 transition-colors">
          Connexion
        </a>
        <a routerLink="/auth/register"
           class="inline-flex items-center gap-2 bg-white text-ink-950 text-sm font-bold px-5 py-2.5 rounded-full hover:bg-ink-100 transition-colors shadow-card">
          S'inscrire
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <a [routerLink]="dashboardLink"
           class="inline-flex items-center gap-2 bg-brand-600 text-white text-sm font-bold px-5 py-2.5 rounded-full hover:bg-brand-500 transition-colors">
          <span class="material-symbols-outlined text-[18px]">space_dashboard</span>
          Mon espace
        </a>
        <button (click)="logout()"
                class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold text-ink-300 hover:text-white hover:bg-white/10 transition-colors">
          <span class="material-symbols-outlined text-[18px]">logout</span>
          Déconnexion
        </button>
      </ng-container>
    </div>

    <!-- Hamburger mobile -->
    <button (click)="toggleMobileMenu()"
            class="lg:hidden w-11 h-11 flex items-center justify-center text-white rounded-full hover:bg-white/10 transition-colors"
            [attr.aria-expanded]="mobileMenuOpen"
            aria-label="Menu">
      <span class="material-symbols-outlined text-[26px]">
        {{ mobileMenuOpen ? 'close' : 'menu' }}
      </span>
    </button>
  </nav>
</header>

<!-- ====================================================================
     Menu mobile plein écran
     ==================================================================== -->
<div *ngIf="mobileMenuOpen"
     class="lg:hidden fixed inset-x-0 top-[var(--header-h)] bottom-0 z-40 bg-ink-950 flex flex-col justify-between px-6 pt-8 pb-safe animate-fade-in">

  <nav class="flex flex-col gap-1">
    <a routerLink="/" (click)="toggleMobileMenu()"
       class="flex items-center justify-between text-white text-xl font-bold py-4 border-b border-white/[.06]">
      Accueil
      <span class="material-symbols-outlined text-ink-500">chevron_right</span>
    </a>
    <a routerLink="/fleet" (click)="toggleMobileMenu()"
       class="flex items-center justify-between text-white text-xl font-bold py-4 border-b border-white/[.06]">
      Notre flotte
      <span class="material-symbols-outlined text-ink-500">chevron_right</span>
    </a>
    <a routerLink="/about" (click)="toggleMobileMenu()"
       class="flex items-center justify-between text-white text-xl font-bold py-4 border-b border-white/[.06]">
      À propos
      <span class="material-symbols-outlined text-ink-500">chevron_right</span>
    </a>
    <a routerLink="/contact" (click)="toggleMobileMenu()"
       class="flex items-center justify-between text-white text-xl font-bold py-4 border-b border-white/[.06]">
      Contact
      <span class="material-symbols-outlined text-ink-500">chevron_right</span>
    </a>
    <a *ngIf="isLoggedIn" [routerLink]="dashboardLink" (click)="toggleMobileMenu()"
       class="flex items-center justify-between text-brand-400 text-xl font-bold py-4">
      Mon espace
      <span class="material-symbols-outlined">space_dashboard</span>
    </a>
  </nav>

  <div class="flex flex-col gap-3 pb-6">
    <ng-container *ngIf="!isLoggedIn">
      <a routerLink="/auth/login" (click)="toggleMobileMenu()"
         class="w-full text-center bg-white/10 text-white font-bold py-4 rounded-2xl">
        Connexion
      </a>
      <a routerLink="/auth/register" (click)="toggleMobileMenu()"
         class="w-full text-center bg-white text-ink-950 font-bold py-4 rounded-2xl">
        Créer un compte
      </a>
    </ng-container>

    <button *ngIf="isLoggedIn" (click)="logout()"
            class="w-full flex items-center justify-center gap-2 bg-white/10 text-red-400 font-bold py-4 rounded-2xl">
      <span class="material-symbols-outlined text-[20px]">logout</span>
      Déconnexion
    </button>
  </div>
</div>
