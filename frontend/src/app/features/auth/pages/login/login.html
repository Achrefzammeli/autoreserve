<div>
  <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Bon retour parmi nous 👋</h1>
  <p class="mt-2 text-ink-500">Connectez-vous pour gérer vos réservations.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5">

    <div *ngIf="errorMessage()" class="alert-error animate-fade-in">
      <span class="material-symbols-outlined text-[20px]">error</span>
      {{ errorMessage() }}
    </div>

    <label class="block">
      <span class="label">Adresse e-mail</span>
      <div class="input-icon-wrap">
        <span class="material-symbols-outlined">mail</span>
        <input type="email" formControlName="email" class="input" placeholder="vous@exemple.com" autocomplete="email" />
      </div>
      <p *ngIf="isInvalid('email')" class="field-error">
        <span class="material-symbols-outlined text-[16px]">error</span>
        Adresse e-mail valide requise
      </p>
    </label>

    <label class="block">
      <div class="flex items-center justify-between">
        <span class="label !mb-0">Mot de passe</span>
        <a routerLink="/auth/forgot-password" class="text-[13px] font-bold text-brand-600 hover:text-brand-700">
          Mot de passe oublié ?
        </a>
      </div>
      <div class="input-icon-wrap mt-2">
        <span class="material-symbols-outlined">lock</span>
        <input [type]="showPassword() ? 'text' : 'password'" formControlName="password"
               class="input !pr-12" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" (click)="togglePassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-lg text-ink-400 hover:text-ink-700 hover:bg-ink-50 transition-colors"
                [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
          <span class="material-symbols-outlined text-[20px]">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
      <p *ngIf="isInvalid('password')" class="field-error">
        <span class="material-symbols-outlined text-[16px]">error</span>
        Mot de passe requis
      </p>
    </label>

    <button type="submit" class="btn-primary btn-lg w-full" [disabled]="loading()">
      <span *ngIf="loading()" class="w-5 h-5 rounded-full border-2 border-white/40 border-t-white animate-spin"></span>
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>

  <p class="mt-8 text-center text-sm text-ink-500">
    Pas encore de compte ?
    <a routerLink="/auth/register" class="font-extrabold text-brand-600 hover:text-brand-700">Créer un compte</a>
  </p>
</div>
