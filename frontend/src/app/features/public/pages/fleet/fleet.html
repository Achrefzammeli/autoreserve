<div class="p-6">

  <h1 class="text-2xl font-bold mb-6">Our Fleet</h1>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center">
    Loading vehicles...
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <div
      *ngFor="let v of vehicles"
      class="bg-white shadow-md rounded-lg overflow-hidden"
    >

      <!-- Image -->
      <img
        [src]="v.image_url || 'https://via.placeholder.com/300'"
        class="w-full h-40 object-cover"
      />

      <!-- Content -->
      <div class="p-4">

        <!-- Brand + Model -->
        <h2 class="text-lg font-bold">
          {{ v.brand }} {{ v.model }}
        </h2>

        <!-- Type -->
        <p class="text-sm text-gray-500">
          {{ v.type }}
        </p>

        <!-- Status -->
        <span
          class="inline-block mt-2 px-2 py-1 text-xs rounded"
          [ngClass]="{
            'bg-green-200 text-green-800': v.status === 'AVAILABLE',
            'bg-red-200 text-red-800': v.status !== 'AVAILABLE'
          }"
        >
          {{ v.status }}
        </span>

        <!-- Price -->
        <div class="mt-3 text-xl font-bold text-blue-600">
          {{ v.price_per_day }} TND / day
        </div>

        <!-- Button -->
        <button
          class="mt-4 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
        >
          Book Now
        </button>

      </div>

    </div>

  </div>

</div>
